name: RouteForgeProbe
options:
  deploymentTarget:
    iOS: '17.4'
  createIntermediateGroups: true
packages:
  RouteCore:
    path: RouteCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  RouteForgeProbe:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
      - path: Resources
        buildPhase: resources
      - path: Vendor/DeviceSupport
        type: folder
        buildPhase: resources
    dependencies:
      - package: RouteCore
      - framework: Vendor/IDevice.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
      - sdk: MapKit.framework
      - sdk: libc++.tbd
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.routeforge.locationprobe
        PRODUCT_NAME: RouteForgeProbe
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 5
        INFOPLIST_FILE: App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: App/Native/RouteForgeProbe-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        ENABLE_BITCODE: NO
schemes:
  RouteForgeProbe:
    build:
      targets:
        RouteForgeProbe: all

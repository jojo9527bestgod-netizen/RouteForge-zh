name: Build RouteForge iPhone app

# Deliberately manual: pushing Android changes must not publish an iOS artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out the requested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install project generator
        run: brew install xcodegen
      - name: Build and test unsigned iPhone app
        working-directory: ios-probe
        run: bash scripts/build.sh
      - name: Save unsigned IPA for local signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RouteForgeProbe-unsigned
          path: ios-probe/build/RouteForgeProbe-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
